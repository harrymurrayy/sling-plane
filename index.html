<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2f6fe0" />
    <title>Slingwing</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="speed-lines" aria-hidden="true"></canvas>
    <div id="edge-warn" aria-hidden="true"></div>
    <div id="edge-flash" aria-hidden="true"></div>
    <div id="hud" class="hidden">
      <div id="stats-pill" class="stats ui">
        <div class="dist"><span id="dist">0</span><small>m</small></div>
        <div class="sub">Best <span id="best">0</span>m</div>
      </div>
      <div class="right">
        <div class="coins ui"><span class="coin-icon"></span><span id="coins">0</span></div>
      </div>
    </div>
    <div id="goal" class="ui hidden">
      <div class="goal-head"><span id="goal-name"></span><span id="goal-stars" class="mini-stars"></span><span id="goal-target"></span></div>
      <div class="goal-track">
        <div id="goal-ghost"></div>
        <div id="goal-fill"></div>
        <div id="goal-best" class="hidden"></div>
        <svg class="goal-flag" viewBox="0 0 16 18" aria-hidden="true"><path class="pole" d="M3 17V2" /><path class="cloth" d="M3.5 2.5h10l-2.6 3.2 2.6 3.3h-10z" /></svg>
      </div>
      <div class="goal-foot"><span id="goal-best-label" class="hidden"></span></div>
    </div>
    <button id="settings-btn" class="btn btn-blue btn-round" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div id="settings" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-card ui">
        <header>
          <div id="settings-title" class="ink settings-title">Settings</div>
          <button id="settings-close" class="btn btn-red btn-round" aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </header>
        <div class="settings-list"></div>
        <footer class="settings-foot"><a href="./privacy.html">Privacy policy</a></footer>
      </div>
    </div>
    <div id="power" class="ui hidden"><span class="power-label">Power</span><div class="power-track"><div id="power-sweet"></div><div id="power-fill"></div></div></div>
    <div id="fuel" class="ui hidden"><div class="label">Fuel</div><div class="bar"><div id="fuel-fill"></div></div></div>
    <svg id="speedo" class="hidden"></svg>
    <div id="altimeter" class="hidden"></div>
    <button id="boost-btn" class="btn btn-orange hidden"><span>Boost</span><div class="bar"><div id="rocket-fill"></div></div></button>
    <button id="hangar-btn" class="btn btn-blue hidden"><svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Hangar<span id="hangar-badge" class="badge hidden"></span></button>
    <button id="map-btn" class="btn btn-yellow hidden"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2.6l2.85 5.95 6.55.85-4.8 4.55 1.2 6.5L12 17.3l-5.8 3.15 1.2-6.5-4.8-4.55 6.55-.85z"/></svg>Levels</button>
    <div id="hint" class="ui"></div>

    <div id="title">
      <div class="logo" data-text="Slingwing">Slingwing</div>
      <div id="title-level" class="title-level ui"></div>
      <div id="title-best" class="title-best"></div>
      <div class="start btn btn-green">Tap to fly</div>
    </div>

    <div id="result" class="hidden">
      <div class="panel ui">
        <div class="ribbon">Distance</div>
        <div class="big"><span id="result-dist">0</span><small>m</small></div>
        <div id="result-best" class="label"></div>
        <div id="result-stars" class="result-stars"></div>
        <div id="result-next" class="result-next"></div>
        <div id="result-unlock" class="unlock hidden"></div>
        <div class="rows">
          <div><span>Distance bonus</span><span id="result-distcoins">0</span></div>
          <div><span>Coins collected</span><span id="result-pickups">0</span></div>
          <div><span>Coin value</span><span id="result-mult">×1</span></div>
          <div id="row-biome"><span id="result-biome-name">Biome bonus</span><span id="result-biome">×1</span></div>
          <div id="row-record"><span>Record bonus</span><span id="result-record">+0</span></div>
          <div id="row-checkpoint"><span>Level complete</span><span id="result-checkpoint">+0</span></div>
          <div id="row-stars"><span>New stars</span><span id="result-starcoins">+0</span></div>
          <div class="total"><span>Earned</span><span><span class="coin-icon"></span><span id="result-total">0</span></span></div>
        </div>
        <div class="wallet-row"><span>Wallet</span><span class="coin-icon"></span><span id="result-wallet">0</span></div>
        <div class="buttons">
          <div class="button-row">
            <button id="result-hangar" class="btn btn-blue"><svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Hangar<span id="result-badge" class="badge hidden"></span></button>
            <button id="result-map" class="btn btn-yellow"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2.6l2.85 5.95 6.55.85-4.8 4.55 1.2 6.5L12 17.3l-5.8 3.15 1.2-6.5-4.8-4.55 6.55-.85z"/></svg>Levels</button>
          </div>
          <button id="result-fly" class="btn btn-green">Fly again</button>
        </div>
      </div>
    </div>

    <div id="hangar" class="screen hidden">
      <div class="hangar-screen">
        <header class="hangar-top">
          <div class="hangar-name">
            <div class="title" data-text="Hangar">Hangar</div>
            <div class="hangar-sub"></div>
          </div>
          <div class="wallet ui"><span class="coin-icon"></span><span class="wallet-amount">0</span></div>
        </header>
        <nav class="tabs"></nav>
        <div class="cards"></div>
        <footer class="hangar-bottom">
          <div id="dev" class="hidden"><button id="dev-coins" class="btn btn-small btn-blue">+1000</button><button id="dev-free" class="btn btn-small btn-yellow">Max + free</button></div>
          <button id="reset-progress" class="btn btn-small btn-plain">Reset progress</button>
          <button id="hangar-fly" class="btn btn-green">Fly</button>
        </footer>
      </div>
    </div>
    <div id="map" class="screen hidden">
      <div class="hangar-screen">
        <header class="hangar-top">
          <div class="hangar-name">
            <div class="title">Levels</div>
            <div class="hangar-sub map-sub"></div>
          </div>
          <div class="wallet ui"><svg class="icon star-icon" viewBox="0 0 24 24"><path d="M12 2.6l2.85 5.95 6.55.85-4.8 4.55 1.2 6.5L12 17.3l-5.8 3.15 1.2-6.5-4.8-4.55 6.55-.85z"/></svg><span class="map-total">0</span></div>
        </header>
        <div class="map-list"></div>
        <footer class="map-bottom">
          <div class="map-detail"></div>
          <button id="map-fly" class="btn btn-green">Fly</button>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
